[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deva-engineering"
version = "0.1.0"
description = "Reproducible adversarial engineering capacity-network research core"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]

[project.scripts]
deva = "deva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
