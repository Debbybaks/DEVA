[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deva-engineering"
version = "0.4.0"
description = "Reproducible adversarial engineering capacity-network research core"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1", "z3-solver==4.16.0.0"]
formal = ["z3-solver==4.16.0.0"]

[project.scripts]
deva = "deva.cli:main"
deva-evolve = "deva.evolve_cli:main"
deva-diagnose = "deva.diagnose:main"

[tool.setuptools.packages.find]
where = ["src"]
